<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPOTY — Poker Player of the Year</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #182028;
    --panel-2: #1e2830;
    --border: #2a3540;
    --text: #e8edf1;
    --text-dim: #8a97a3;
    --accent: #3ecf8e;
    --accent-2: #f2b84b;
    --red: #e0655a;
    --gold: #f2c94c;
    --silver: #c7ccd1;
    --bronze: #cd8a4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: 0.2px; }
  h1 span { color: var(--accent); }
  .meta { color: var(--text-dim); font-size: 13px; }
  .subtitle { color: var(--text-dim); margin: 6px 0 28px; font-size: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .card h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin: 0 0 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 .badge { text-transform: none; font-size: 12px; color: var(--accent); letter-spacing: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr.clickable { cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank { width: 28px; text-align: center; font-weight: 700; color: var(--text-dim); }
  .rank.g { color: var(--gold); }
  .rank.s { color: var(--silver); }
  .rank.b { color: var(--bronze); }
  .player-name { font-weight: 600; }
  .player-name .chevron { display: inline-block; color: var(--text-dim); font-size: 11px; margin-right: 6px; transition: transform 0.15s; }
  .player-name .chevron.open { transform: rotate(90deg); }
  .pos { color: var(--accent); }
  .neg { color: var(--red); }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; background: var(--panel-2); color: var(--text-dim);
  }
  .pill.win { background: rgba(242,201,76,0.15); color: var(--gold); }
  .pill.guest { background: rgba(138,151,163,0.15); color: var(--text-dim); }
  canvas { max-height: 380px; }
  .tourn-header { display:flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .tourn-title { font-weight: 600; }
  .tourn-sub { color: var(--text-dim); font-size: 13px; }
  .empty { color: var(--text-dim); text-align: center; padding: 40px 0; }
  .legend-note { color: var(--text-dim); font-size: 12px; margin-top: 10px; }
  .table-scroll { overflow-x: auto; }
  .drill-row td { background: var(--panel-2); padding: 16px 20px; }
  .drill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .drill-stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .drill-stat .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .drill-stat .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .history-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 700px) { .history-cols { grid-template-columns: 1fr; } }
  .calc-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  .calc-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .calc-field input {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 8px 10px; font-size: 14px; width: 110px;
  }
  .calc-results { display: flex; gap: 12px; flex-wrap: wrap; }
  .calc-pill { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; }
  .calc-pill .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }
  .calc-pill .value { font-size: 20px; font-weight: 700; }
  .calc-pill.first .value { color: var(--gold); }
  .calc-pill.second .value { color: var(--silver); }
  .calc-pill.third .value { color: var(--bronze); }
  .champion-tag { font-size: 15px; font-weight: 500; color: var(--text-dim); margin-left: 14px; white-space: nowrap; }
  .champion-name {
    color: var(--gold);
    font-weight: 800;
    margin-left: 4px;
    display: inline-block;
    animation: championGlow 1.8s ease-in-out infinite;
  }
  @keyframes championGlow {
    0%, 100% { text-shadow: 0 0 4px rgba(242,201,76,0.35); opacity: 1; transform: scale(1); }
    50% { text-shadow: 0 0 12px rgba(242,201,76,0.95), 0 0 24px rgba(242,201,76,0.6); opacity: 0.88; transform: scale(1.04); }
  }
  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 24px; align-items: start; }
  .sidebar { position: sticky; top: 20px; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
  }
  .sched-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .sched-item:last-child { border-bottom: none; padding-bottom: 0; }
  .sched-item:first-child { padding-top: 0; }
  .sched-name { font-weight: 700; font-size: 14px; }
  .sched-date { font-size: 13px; margin-top: 2px; }
  .sched-place { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .sched-item.official .sched-name,
  .sched-item.official .sched-date {
    color: var(--gold);
    animation: championGlow 1.8s ease-in-out infinite;
  }
  .sched-item.official .sched-place { color: var(--gold); opacity: 0.75; }
  .sched-item.proposed .sched-name { color: var(--text); }
  .sched-item.proposed .sched-date { color: var(--text-dim); }
  .sched-item.proposed .sched-place { color: var(--text-dim); }

  .gallery-group { margin-bottom: 20px; }
  .gallery-group:last-child { margin-bottom: 0; }
  .gallery-date-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .gallery-thumb {
    position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 8px;
    cursor: pointer; background: var(--panel-2); border: 1px solid var(--border);
  }
  .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s ease; }
  .gallery-thumb:hover img { transform: scale(1.06); }
  .lightbox-overlay {
    position: fixed; inset: 0; background: rgba(6,9,12,0.92);
    display: none; align-items: center; justify-content: center; z-index: 1000; padding: 24px;
  }
  .lightbox-overlay.open { display: flex; }
  .lightbox-overlay img { max-width: 100%; max-height: 86vh; border-radius: 8px; box-shadow: 0 10px 50px rgba(0,0,0,0.6); }
  .lightbox-close, .lightbox-nav {
    position: absolute; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text); cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .lightbox-close { top: 18px; right: 18px; width: 40px; height: 40px; font-size: 20px; }
  .lightbox-nav { top: 50%; transform: translateY(-50%); width: 48px; height: 48px; font-size: 22px; }
  .lightbox-prev { left: 18px; }
  .lightbox-next { right: 18px; }
  .lightbox-close:hover, .lightbox-nav:hover { background: rgba(255,255,255,0.18); }
  .lightbox-caption { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: var(--text-dim); font-size: 13px; }

  .scenario-game { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .scenario-game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .scenario-game-title { font-weight: 700; font-size: 14px; }
  .scenario-game-config { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .scenario-game-config .calc-field input { width: 90px; }
  .scenario-pot-preview { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  .scenario-pot-preview b { color: var(--text); }
  .scenario-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 16px; }
  .scenario-player-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .scenario-player-row label { display: flex; align-items: center; gap: 6px; flex: 1; cursor: pointer; }
  .scenario-player-row input[type="number"] {
    width: 56px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 5px 6px; font-size: 13px;
  }
  .scenario-player-row input[type="number"]:disabled { opacity: 0.35; }
  .scenario-remove-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .scenario-remove-btn:hover { color: var(--red); border-color: var(--red); }
  .scenario-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; margin-right: 10px;
  }
  .scenario-btn:hover { border-color: var(--accent); color: var(--accent); }
  .scenario-btn-ghost { color: var(--text-dim); }
  .scenario-warning { color: var(--accent-2); font-size: 12px; margin-top: 8px; }
  .scenario-empty { color: var(--text-dim); font-size: 13px; padding: 8px 0 16px; }
  .rank-change { font-size: 11px; margin-left: 6px; white-space: nowrap; }
  .rank-change.up { color: var(--accent); }
  .rank-change.down { color: var(--red); }
  .rank-change.same { color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PPOTY <span>&middot;</span> League Dashboard<span class="champion-tag">Champion: <span class="champion-name" id="championName">—</span></span></h1>
    <div style="text-align:right;">
      <div class="meta" id="lastUpdated">loading…</div>
      <div class="meta"><a href="docs/PPOTN-Constitution-and-Rules.pdf" id="constitutionLink" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline dotted;">PPOTN Constitution &amp; Rules</a></div>
    </div>
  </header>
  <div class="subtitle">Poker Player of the Year — season standings, pulled straight from Tournament Director exports.</div>

  <div class="layout">
    <aside class="sidebar">
      <div class="card">
        <h2>Scheduled Games</h2>
        <div id="scheduledGames"><div class="empty">Loading…</div></div>
      </div>
    </aside>
    <div id="content">
      <div class="empty">Loading season data…</div>
    </div>
  </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <button class="lightbox-close" id="lightboxClose">&#10005;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#10094;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightboxNext">&#10095;</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
let SEASON_DATA = null;

async function load() {
  const el = document.getElementById('content');
  let data;
  try {
    const res = await fetch('data/season.json?_=' + Date.now());
    if (!res.ok) throw new Error('no data file');
    data = await res.json();
  } catch (e) {
    el.innerHTML = '<div class="card"><div class="empty">No season data yet. Once tournament files are added to <code>data/tournaments/</code> and the build runs, standings will show up here.</div></div>';
    document.getElementById('lastUpdated').textContent = '';
    return;
  }
  SEASON_DATA = data;

  const season = data.seasons[data.current_season_id] || null;

  document.getElementById('lastUpdated').textContent = data.generated_at
    ? `updated ${new Date(data.generated_at).toLocaleString()}`
    : '';

  el.innerHTML = `
    <div class="card">
      <h2>Season Leaderboard — Gross Winnings <span class="badge">${season ? season.label : ''}</span></h2>
      <div id="leaderboardWrap"></div>
    </div>
    <div class="card">
      <h2>Scenario Builder <span class="badge">What-if standings</span></h2>
      <div class="legend-note" style="margin-top:-8px; margin-bottom:16px;">Add hypothetical games below to see how they'd shift the season leaderboard. This is a live sandbox — nothing here is saved or affects the real standings.</div>
      <div id="scenarioGames"></div>
      <div style="margin-bottom:18px;">
        <button class="scenario-btn" id="addScenarioGameBtn">+ Add hypothetical game</button>
        <button class="scenario-btn scenario-btn-ghost" id="resetScenarioBtn">Reset all</button>
      </div>
      <div id="scenarioResults"></div>
    </div>
    <div class="card">
      <h2>League History</h2>
      <div class="history-cols">
        <div>
          <h2 style="margin-bottom:8px;">Champions by Year</h2>
          <div class="table-scroll" id="champsWrap"></div>
        </div>
        <div>
          <h2 style="margin-bottom:8px;">Career Trophy Count</h2>
          <div class="table-scroll" id="trophyWrap"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Big Game Payout Calculator</h2>
      <div class="calc-row">
        <div class="calc-field">
          <label>Buy-in ($)</label>
          <input type="number" id="calcBuyin" value="250" min="0" step="5">
        </div>
        <div class="calc-field">
          <label>Players</label>
          <input type="number" id="calcPlayers" value="12" min="0" step="1">
        </div>
      </div>
      <div class="calc-results" id="calcResults"></div>
      <div class="legend-note">Standard split: 50% / 30% / 20% of the pool to 1st / 2nd / 3rd.</div>
    </div>
    <div class="card">
      <h2>Last PPOTN Results</h2>
      <div id="tournaments"></div>
    </div>
    <div class="card">
      <h2>Photo Gallery <span class="badge"><a href="https://forms.gle/92GndzF5ByH8uup99" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline dotted;">+ Submit a photo</a></span></h2>
      <div id="photoGallery"></div>
    </div>
  `;

  try { renderChampionBadge(data.history); } catch (e) { console.error('renderChampionBadge failed', e); }
  try { renderScheduledGames(data.scheduled_games); } catch (e) { console.error('renderScheduledGames failed', e); }
  try { renderLeaderboard(season); } catch (e) { console.error('renderLeaderboard failed', e); }
  try { initScenarioBuilder(data); } catch (e) { console.error('initScenarioBuilder failed', e); }
  try { renderHistory(data.history); } catch (e) { console.error('renderHistory failed', e); }
  try { renderCalculator(); } catch (e) { console.error('renderCalculator failed', e); }
  try { renderTournaments(data.tournaments, data.roster); } catch (e) { console.error('renderTournaments failed', e); }
  try { renderPhotoGallery(data.photos); } catch (e) { console.error('renderPhotoGallery failed', e); }
}

function renderChampionBadge(history) {
  const el = document.getElementById('championName');
  if (!el) return;
  const champs = (history && history.champions) || [];
  const decided = champs.filter(c => c.name).sort((a, b) => a.year - b.year);
  const latest = decided.length ? decided[decided.length - 1] : null;
  el.textContent = latest ? `${latest.name} (${latest.year})` : '—';
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function ordinal(n) {
  const rem100 = n % 100;
  if (rem100 >= 11 && rem100 <= 13) return n + 'th';
  switch (n % 10) {
    case 1: return n + 'st';
    case 2: return n + 'nd';
    case 3: return n + 'rd';
    default: return n + 'th';
  }
}

function fmtFullDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  return `${MONTH_NAMES[d.getMonth()]} ${ordinal(d.getDate())}, ${d.getFullYear()}`;
}

function renderScheduledGames(events) {
  const wrap = document.getElementById('scheduledGames');
  if (!wrap) return;
  if (!events || !events.length) {
    wrap.innerHTML = '<div class="empty">No games on the books yet.</div>';
    return;
  }
  const sorted = events.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  wrap.innerHTML = sorted.map(e => {
    const official = (e.status || 'scheduled') === 'scheduled';
    return `
      <div class="sched-item ${official ? 'official' : 'proposed'}">
        <div class="sched-name">${e.name}</div>
        <div class="sched-date">${fmtFullDate(e.date)}</div>
        <div class="sched-place">${e.place || 'TBD'}</div>
      </div>
    `;
  }).join('');
}

function medalClass(i) {
  return i === 0 ? 'g' : i === 1 ? 's' : i === 2 ? 'b' : '';
}

function fmtMoney(n, showSign) {
  const v = Math.round(n);
  const sign = showSign && v > 0 ? '+' : '';
  return `${v < 0 ? '-' : sign}$${Math.abs(v)}`;
}

function renderLeaderboard(season) {
  const wrap = document.getElementById('leaderboardWrap');
  if (!season || !season.players.length) {
    wrap.innerHTML = `<div class="empty">No completed ${season ? season.label : 'season'} games yet for the roster. Upload a finished tournament to see standings.</div>`;
    return;
  }
  const players = season.players;
  const rows = players.map((p, i) => `
    <tr class="clickable" data-uuid="${p.uuid}">
      <td class="rank ${medalClass(i)}">${i + 1}</td>
      <td class="player-name"><span class="chevron">&#9656;</span>${p.name}${p.wins ? ` <span class="pill win">${p.wins}x win${p.wins > 1 ? 's' : ''}</span>` : ''}</td>
      <td class="num">${p.tournaments_played}</td>
      <td class="num">${p.cashes} <span style="color:var(--text-dim)">(${Math.round(p.itm_pct * 100)}%)</span></td>
      <td class="num ${p.total_winnings > 0 ? 'pos' : ''}">$${Math.round(p.total_winnings)}</td>
      <td class="num ${p.diff === 0 ? '' : 'neg'}">${p.diff === 0 ? '—' : fmtMoney(p.diff)}</td>
      <td class="num">${p.avg_place ?? '–'}</td>
      <td class="num">${p.best_place ?? '–'}</td>
    </tr>
    <tr class="drill-row" id="drill-${p.uuid}" style="display:none;">
      <td colspan="8">${renderDrillDown(p)}</td>
    </tr>
  `).join('');

  wrap.innerHTML = `
    <div class="table-scroll">
      <table id="leaderboard">
        <thead>
          <tr>
            <th></th>
            <th>Player</th>
            <th class="num">Played</th>
            <th class="num">ITM</th>
            <th class="num">Winnings</th>
            <th class="num">Diff</th>
            <th class="num">Avg Finish</th>
            <th class="num">Best Finish</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;

  wrap.querySelectorAll('tr.clickable').forEach(row => {
    row.addEventListener('click', () => {
      const uuid = row.getAttribute('data-uuid');
      const drill = document.getElementById(`drill-${uuid}`);
      const chevron = row.querySelector('.chevron');
      const isOpen = drill.style.display !== 'none';
      drill.style.display = isOpen ? 'none' : 'table-row';
      chevron.classList.toggle('open', !isOpen);
    });
  });
}

function renderDrillDown(p) {
  const rows = p.history.slice().reverse().map(h => `
    <tr>
      <td>${h.date || ''}</td>
      <td>${h.title}</td>
      <td class="rank ${medalClass((h.place || 99) - 1)}">${h.place ?? '–'}</td>
      <td class="num ${h.prize_dollars > 0 ? 'pos' : ''}">$${Math.round(h.prize_dollars)}</td>
      <td class="num ${h.net >= 0 ? 'pos' : 'neg'}">${fmtMoney(h.net, true)}</td>
    </tr>
  `).join('');

  return `
    <div class="drill-grid">
      <div class="drill-stat"><div class="label">Games played</div><div class="value">${p.tournaments_played}</div></div>
      <div class="drill-stat"><div class="label">1st place finishes</div><div class="value">${p.wins}</div></div>
      <div class="drill-stat"><div class="label">In the money</div><div class="value">${p.cashes} (${Math.round(p.itm_pct * 100)}%)</div></div>
      <div class="drill-stat"><div class="label">Avg finish</div><div class="value">${p.avg_place ?? '–'}</div></div>
      <div class="drill-stat"><div class="label">Best finish</div><div class="value">${p.best_place ?? '–'}</div></div>
      <div class="drill-stat"><div class="label">Net</div><div class="value">${fmtMoney(p.net, true)}</div></div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Date</th><th>Tournament</th><th class="rank">Place</th><th class="num">Winnings</th><th class="num">Net</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderHistory(history) {
  const champsWrap = document.getElementById('champsWrap');
  const trophyWrap = document.getElementById('trophyWrap');
  if (!history || !history.champions || !history.champions.length) {
    champsWrap.innerHTML = '<div class="empty">No history recorded yet.</div>';
    trophyWrap.innerHTML = '';
    return;
  }
  const champRows = history.champions.slice().reverse().map(c => `
    <tr><td>${c.year}</td><td>${c.name || '<span style="color:var(--text-dim)">in progress</span>'}</td></tr>
  `).join('');
  champsWrap.innerHTML = `<table><thead><tr><th>Year</th><th>Champion</th></tr></thead><tbody>${champRows}</tbody></table>`;

  const trophyRows = history.trophy_counts.map((t, i) => `
    <tr><td class="rank ${medalClass(i)}">${i + 1}</td><td class="player-name">${t.name}</td><td class="num">${t.count}</td></tr>
  `).join('');
  trophyWrap.innerHTML = `<table><thead><tr><th></th><th>Player</th><th class="num">Titles</th></tr></thead><tbody>${trophyRows}</tbody></table>`;
}

function renderCalculator() {
  const buyinEl = document.getElementById('calcBuyin');
  const playersEl = document.getElementById('calcPlayers');
  const resultsEl = document.getElementById('calcResults');

  function update() {
    const buyin = parseFloat(buyinEl.value) || 0;
    const players = parseFloat(playersEl.value) || 0;
    const pool = buyin * players;
    resultsEl.innerHTML = `
      <div class="calc-pill"><div class="label">Pool</div><div class="value">$${Math.round(pool)}</div></div>
      <div class="calc-pill first"><div class="label">1st (50%)</div><div class="value">$${Math.round(pool * 0.5)}</div></div>
      <div class="calc-pill second"><div class="label">2nd (30%)</div><div class="value">$${Math.round(pool * 0.3)}</div></div>
      <div class="calc-pill third"><div class="label">3rd (20%)</div><div class="value">$${Math.round(pool * 0.2)}</div></div>
    `;
  }
  buyinEl.addEventListener('input', update);
  playersEl.addEventListener('input', update);
  update();
}

function renderTournaments(tournaments, roster) {
  const container = document.getElementById('tournaments');
  if (!tournaments.length) {
    container.innerHTML = '<div class="empty">No completed tournaments yet.</div>';
    return;
  }
  const sorted = tournaments.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const recent = sorted.slice(0, 2);
  container.innerHTML = recent.map(t => {
    const rows = t.results.slice(0, 3).map(r => `
      <tr>
        <td class="rank ${medalClass((r.place || 99) - 1)}">${r.place ?? '–'}</td>
        <td>${r.name}${!r.is_roster ? ' <span class="pill guest">guest</span>' : ''}</td>
        <td class="num ${r.prize_dollars > 0 ? 'pos' : ''}">$${Math.round(r.prize_dollars)}</td>
      </tr>
    `).join('');
    return `
      <div class="card" style="background: var(--panel-2); margin-bottom: 14px;">
        <div class="tourn-header">
          <div class="tourn-title">${t.title}</div>
          <div class="tourn-sub">${t.date || ''} · ${t.num_players} players · $${Math.round(t.total_pot)} pot${t.season_id ? '' : ' · <span style="color:var(--text-dim)">outside tracked seasons</span>'}</div>
        </div>
        <table style="margin-top:10px;">
          <thead><tr><th></th><th>Player</th><th class="num">Prize</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }).join('');
}

function monthLabel(dateStr) {
  if (!dateStr) return 'Undated';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return 'Undated';
  return `${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
}

let GALLERY_PHOTOS = [];

function renderPhotoGallery(photos) {
  const wrap = document.getElementById('photoGallery');
  if (!wrap) return;
  if (!photos || !photos.length) {
    wrap.innerHTML = '<div class="empty">No photos yet.</div>';
    return;
  }
  GALLERY_PHOTOS = photos.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const groups = [];
  let curLabel = null, curGroup = null;
  GALLERY_PHOTOS.forEach((p) => {
    const label = monthLabel(p.date);
    if (label !== curLabel) {
      curLabel = label;
      curGroup = { label, photos: [] };
      groups.push(curGroup);
    }
    curGroup.photos.push(p);
  });

  wrap.innerHTML = groups.map(g => `
    <div class="gallery-group">
      <div class="gallery-date-label">${g.label}</div>
      <div class="gallery-grid">
        ${g.photos.map(p => `
          <div class="gallery-thumb" data-id="${p.id}">
            <img src="${p.thumb}" alt="" loading="lazy">
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  wrap.querySelectorAll('.gallery-thumb').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-id');
      const idx = GALLERY_PHOTOS.findIndex(p => p.id === id);
      openLightbox(idx);
    });
  });
}

let lightboxIndex = 0;

function openLightbox(idx) {
  lightboxIndex = idx;
  showLightboxImage();
  document.getElementById('lightboxOverlay').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightboxOverlay').classList.remove('open');
}

function showLightboxImage() {
  const p = GALLERY_PHOTOS[lightboxIndex];
  if (!p) return;
  document.getElementById('lightboxImg').src = p.full;
  document.getElementById('lightboxCaption').textContent = fmtFullDate(p.date);
}

function lightboxStep(delta) {
  if (!GALLERY_PHOTOS.length) return;
  lightboxIndex = (lightboxIndex + delta + GALLERY_PHOTOS.length) % GALLERY_PHOTOS.length;
  showLightboxImage();
}

document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightboxPrev').addEventListener('click', () => lightboxStep(-1));
document.getElementById('lightboxNext').addEventListener('click', () => lightboxStep(1));
document.getElementById('lightboxOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'lightboxOverlay') closeLightbox();
});
document.addEventListener('keydown', (e) => {
  const overlay = document.getElementById('lightboxOverlay');
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lightboxStep(-1);
  if (e.key === 'ArrowRight') lightboxStep(1);
});

// --- Scenario builder ---------------------------------------------------

let scenarioGames = [];
let scenarioGameSeq = 0;

function baselineScenarioPlayers(data) {
  const season = data.seasons[data.current_season_id];
  const roster = data.roster || [];
  const byName = {};
  ((season && season.players) || []).forEach(p => { byName[p.name] = p; });
  return roster.map(name => {
    const p = byName[name];
    if (p) {
      return {
        name,
        tournaments_played: p.tournaments_played,
        wins: p.wins,
        cashes: p.cashes,
        total_winnings: p.total_winnings,
        net: p.net,
        sum_place: p.sum_place,
        best_place: p.best_place,
      };
    }
    return { name, tournaments_played: 0, wins: 0, cashes: 0, total_winnings: 0, net: 0, sum_place: 0, best_place: null };
  });
}

function scenarioPayout(place, pot) {
  if (place === 1) return pot * 0.5;
  if (place === 2) return pot * 0.3;
  if (place === 3) return pot * 0.2;
  return 0;
}

function addScenarioGame() {
  scenarioGameSeq += 1;
  scenarioGames.push({
    id: scenarioGameSeq,
    buyin: 100,
    guests: 0,
    guestPlacesRaw: '',
    entries: {},
  });
  renderScenarioGames();
  renderScenarioResults();
}

function parseGuestPlaces(raw) {
  return (raw || '')
    .split(',')
    .map(s => parseInt(s.trim(), 10))
    .filter(n => !isNaN(n));
}

function removeScenarioGame(id) {
  scenarioGames = scenarioGames.filter(g => g.id !== id);
  renderScenarioGames();
  renderScenarioResults();
}

function captureScenarioFocus() {
  const el = document.activeElement;
  if (!el || typeof el.closest !== 'function' || !el.closest('#scenarioGames')) return null;
  return {
    action: el.getAttribute('data-action'),
    gid: el.getAttribute('data-gid'),
    name: el.getAttribute('data-name'),
    selectionStart: (typeof el.selectionStart === 'number') ? el.selectionStart : null,
  };
}

function restoreScenarioFocus(key) {
  if (!key) return;
  let selector = `[data-action="${key.action}"][data-gid="${key.gid}"]`;
  if (key.name) selector += `[data-name="${key.name}"]`;
  const el = document.querySelector('#scenarioGames ' + selector);
  if (!el) return;
  el.focus();
  if (key.selectionStart !== null && typeof el.setSelectionRange === 'function') {
    try { el.setSelectionRange(key.selectionStart, key.selectionStart); } catch (e) { /* ignore */ }
  }
}

function renderScenarioGames() {
  const wrap = document.getElementById('scenarioGames');
  if (!wrap) return;
  const focusKey = captureScenarioFocus();
  const roster = (SEASON_DATA && SEASON_DATA.roster) || [];

  if (!scenarioGames.length) {
    wrap.innerHTML = '<div class="scenario-empty">No hypothetical games yet — click "+ Add hypothetical game" below to start.</div>';
    return;
  }

  wrap.innerHTML = scenarioGames.map((g, gi) => {
    const rosterCount = Object.keys(g.entries).length;
    const guestCount = g.guests || 0;
    const totalPlayers = rosterCount + guestCount;
    const pot = (g.buyin || 0) * totalPlayers;
    const guestPlaces = parseGuestPlaces(g.guestPlacesRaw);
    const rosterPlaces = Object.values(g.entries).filter(v => v !== undefined && v !== null && v !== '' && !isNaN(v));
    const dupe = rosterPlaces.length !== new Set(rosterPlaces).size;
    const guestOverlap = rosterPlaces.some(p => guestPlaces.includes(p));
    const enteredCount = rosterPlaces.length + guestPlaces.length;
    return `
      <div class="scenario-game" data-gid="${g.id}">
        <div class="scenario-game-header">
          <div class="scenario-game-title">Hypothetical Game ${gi + 1}</div>
          <button class="scenario-remove-btn" data-action="remove" data-gid="${g.id}">Remove</button>
        </div>
        <div class="scenario-game-config">
          <div class="calc-field">
            <label>Buy-in ($)</label>
            <input type="number" min="0" step="5" value="${g.buyin}" data-action="buyin" data-gid="${g.id}">
          </div>
          <div class="calc-field">
            <label>Guests in game</label>
            <input type="number" min="0" step="1" value="${guestCount}" data-action="guests" data-gid="${g.id}">
          </div>
        </div>
        <div class="scenario-pot-preview">
          Pot: <b>$${Math.round(pot)}</b> (${rosterCount} roster + ${guestCount} guest${guestCount === 1 ? '' : 's'}) &middot; standard split &mdash; 1st <b>$${Math.round(pot * 0.5)}</b> / 2nd <b>$${Math.round(pot * 0.3)}</b> / 3rd <b>$${Math.round(pot * 0.2)}</b>
          <br>Guest buy-ins count toward the pot; guests don't appear in the projected standings below.
        </div>
        <div class="scenario-players">
          ${roster.map(name => {
            const val = g.entries[name];
            const checked = val !== undefined;
            return `
              <div class="scenario-player-row">
                <label>
                  <input type="checkbox" data-action="toggle" data-gid="${g.id}" data-name="${name}" ${checked ? 'checked' : ''}>
                  ${name}
                </label>
                <input type="number" min="1" step="1" placeholder="place" data-action="place" data-gid="${g.id}" data-name="${name}"
                  value="${checked && val !== '' ? val : ''}" ${checked ? '' : 'disabled'}>
              </div>
            `;
          }).join('')}
        </div>
        ${guestCount > 0 ? `
          <div class="calc-field" style="margin-top:12px;">
            <label>Guest finishes (optional — places guests took, e.g. "1, 4")</label>
            <input type="text" placeholder="e.g. 1, 4" value="${g.guestPlacesRaw || ''}" data-action="guestPlaces" data-gid="${g.id}" style="width:220px;">
          </div>
        ` : ''}
        ${dupe ? '<div class="scenario-warning">Two roster players cannot finish in the same place — fix the duplicate finish above.</div>' : ''}
        ${guestOverlap ? '<div class="scenario-warning">A roster player and a guest can’t both be listed for the same place.</div>' : ''}
        ${enteredCount > totalPlayers ? '<div class="scenario-warning">More finishes entered than total players in this game.</div>' : ''}
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('[data-action="remove"]').forEach(btn => {
    btn.addEventListener('click', () => removeScenarioGame(parseInt(btn.getAttribute('data-gid'), 10)));
  });
  wrap.querySelectorAll('[data-action="buyin"]').forEach(inp => {
    inp.addEventListener('input', () => {
      const g = scenarioGames.find(x => x.id === parseInt(inp.getAttribute('data-gid'), 10));
      if (!g) return;
      g.buyin = parseFloat(inp.value) || 0;
      renderScenarioGames();
      renderScenarioResults();
    });
  });
  wrap.querySelectorAll('[data-action="guests"]').forEach(inp => {
    inp.addEventListener('input', () => {
      const g = scenarioGames.find(x => x.id === parseInt(inp.getAttribute('data-gid'), 10));
      if (!g) return;
      g.guests = parseInt(inp.value, 10) || 0;
      renderScenarioGames();
      renderScenarioResults();
    });
  });
  wrap.querySelectorAll('[data-action="guestPlaces"]').forEach(inp => {
    inp.addEventListener('input', () => {
      const g = scenarioGames.find(x => x.id === parseInt(inp.getAttribute('data-gid'), 10));
      if (!g) return;
      g.guestPlacesRaw = inp.value;
      renderScenarioGames();
      renderScenarioResults();
    });
  });
  wrap.querySelectorAll('[data-action="toggle"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const g = scenarioGames.find(x => x.id === parseInt(cb.getAttribute('data-gid'), 10));
      const name = cb.getAttribute('data-name');
      if (!g) return;
      if (cb.checked) {
        g.entries[name] = '';
      } else {
        delete g.entries[name];
      }
      renderScenarioGames();
      renderScenarioResults();
    });
  });
  wrap.querySelectorAll('[data-action="place"]').forEach(inp => {
    inp.addEventListener('input', () => {
      const g = scenarioGames.find(x => x.id === parseInt(inp.getAttribute('data-gid'), 10));
      const name = inp.getAttribute('data-name');
      if (!g) return;
      g.entries[name] = inp.value === '' ? '' : parseInt(inp.value, 10);
      renderScenarioGames();
      renderScenarioResults();
    });
  });

  restoreScenarioFocus(focusKey);
}

function computeScenarioStandings() {
  const baseline = baselineScenarioPlayers(SEASON_DATA);
  const byName = {};
  baseline.forEach(p => { byName[p.name] = Object.assign({}, p); });

  scenarioGames.forEach(g => {
    const rosterCount = Object.keys(g.entries).length;
    const totalPlayers = rosterCount + (g.guests || 0);
    const pot = (g.buyin || 0) * totalPlayers;
    Object.keys(g.entries).forEach(name => {
      const place = g.entries[name];
      if (place === '' || place === undefined || place === null || isNaN(place)) return;
      const p = byName[name];
      if (!p) return;
      const prize = scenarioPayout(place, pot);
      p.total_winnings += prize;
      p.net += (prize - (g.buyin || 0));
      p.tournaments_played += 1;
      p.sum_place += place;
      if (place === 1) p.wins += 1;
      if (prize > 0) p.cashes += 1;
      p.best_place = p.best_place === null ? place : Math.min(p.best_place, place);
    });
  });

  const projected = Object.values(byName).sort((a, b) => b.total_winnings - a.total_winnings);
  const leader = projected.length ? projected[0].total_winnings : 0;
  projected.forEach(p => { p.diff = p.total_winnings - leader; });

  const baselineSorted = baseline.slice().sort((a, b) => b.total_winnings - a.total_winnings);
  const baselineRank = {};
  baselineSorted.forEach((p, i) => { baselineRank[p.name] = i + 1; });

  return { projected, baselineRank };
}

function renderScenarioResults() {
  const wrap = document.getElementById('scenarioResults');
  if (!wrap) return;
  if (!scenarioGames.length) {
    wrap.innerHTML = '';
    return;
  }

  const { projected, baselineRank } = computeScenarioStandings();
  const rows = projected.map((p, i) => {
    const rank = i + 1;
    const oldRank = baselineRank[p.name] || rank;
    let arrow = '<span class="rank-change same">&ndash;</span>';
    if (oldRank > rank) arrow = `<span class="rank-change up">&#9650; ${oldRank - rank}</span>`;
    if (oldRank < rank) arrow = `<span class="rank-change down">&#9660; ${rank - oldRank}</span>`;
    return `
      <tr>
        <td class="rank ${medalClass(i)}">${rank}</td>
        <td class="player-name">${p.name} ${arrow}</td>
        <td class="num">${p.tournaments_played}</td>
        <td class="num ${p.total_winnings > 0 ? 'pos' : ''}">$${Math.round(p.total_winnings)}</td>
        <td class="num ${p.diff === 0 ? '' : 'neg'}">${p.diff === 0 ? '—' : fmtMoney(p.diff)}</td>
      </tr>
    `;
  }).join('');

  wrap.innerHTML = `
    <div class="legend-note" style="margin-bottom:10px;">Projected standings if the hypothetical games above played out as entered:</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th></th><th>Player</th><th class="num">Played</th><th class="num">Winnings</th><th class="num">Diff</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function initScenarioBuilder(data) {
  scenarioGames = [];
  renderScenarioGames();
  renderScenarioResults();
  const addBtn = document.getElementById('addScenarioGameBtn');
  const resetBtn = document.getElementById('resetScenarioBtn');
  if (addBtn) addBtn.addEventListener('click', addScenarioGame);
  if (resetBtn) resetBtn.addEventListener('click', () => {
    scenarioGames = [];
    renderScenarioGames();
    renderScenarioResults();
  });
}

load();
</script>
