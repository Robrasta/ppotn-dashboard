name: Build season dashboard

on:
  push:
    paths:
      - 'data/tournaments/**'
      - 'data/manual_games.json'
      - 'config/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build season.json from tournament exports
        run: python3 scripts/build.py

      - name: Commit updated stats
        run: |
          git config user.name "ppotn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/season.json
          git diff --staged --quiet || git commit -m "Update season stats [auto]"
          git push
